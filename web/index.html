<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地三维说话头</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./gaze.css"></head>
<body>
<main>
  <header><span class="eyebrow">DIGITAL HUMAN · LOCAL AUDIO</span><h1>本地三维说话头</h1><p>选择本机音频，观察声音节奏与嘴部开合。所有渲染资源均在本地。</p></header>
  <section class="workspace">
    <div class="stage"><canvas id="avatar" aria-label="三维数字人头部"></canvas><span id="avatar-name">资源加载中</span></div>
    <section class="controls" aria-label="音频控制">
      <p id="status" role="status" aria-label="播放状态" aria-live="polite">加载三维资源中…</p>
      <label class="file-label" for="audio-file">选择本地音频<input id="audio-file" type="file" accept="audio/*"></label>
      <button id="sample" disabled>载入中文录音示例</button><p id="audio-name">尚未选择音频</p>
      <div class="buttons"><button id="play" disabled>播放音频</button><button id="stop" disabled>停止</button></div>
      <div class="readings"><span>音频时间 <output id="audio-time" aria-label="音频时间" aria-live="off">0.00</output> 秒</span><span>嘴部开合 <output id="mouth-weight" aria-label="嘴部开合" aria-live="off">0.00</output></span></div><audio id="audio" preload="metadata" aria-label="当前本地音频"></audio>
      <label for="expression">微笑强度 <input id="expression" type="range" min="0" max="1" step="0.05" value="0"></label><details><summary>播放记录</summary><p class="note">用于关联可见动画和音频，记录仅保留在当前页面内。</p><pre id="frame">尚无播放记录</pre><button id="download" disabled>下载播放记录</button></details><p class="note">节奏口型依据实际音频播放位置，不代表音素级唇形。中文示例为 CC0 授权的《你好》录音。</p>
      <details open class="gaze-controls"><summary>人脸位置注视</summary>
        <p id="gaze-status" role="status" aria-label="注视状态" aria-live="polite">注视未启动。图片、视频和摄像头均只在本机检测。</p>
        <label for="face-file">选择固定人脸图片或视频<input id="face-file" type="file" accept="image/*,video/*" disabled></label>
        <div class="buttons"><button id="camera-start" disabled>开启摄像头注视</button><button id="gaze-stop" disabled>停止注视</button></div>
        <div class="gaze-preview"><img id="face-image" alt="固定人脸输入预览" hidden><video id="face-video" aria-label="人脸视频输入预览" muted playsinline hidden></video></div>
        <p class="note">仅检测在场和人脸位置；不识别身份、情绪或人眼视线。摄像头预览为镜像；数字人看向预览中人脸所在一侧。</p>
        <details><summary>注视检测记录</summary><pre id="gaze-record" aria-label="注视检测记录">{}</pre></details>
      </details>
    </section>
  </section>
</main>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script><script type="module" src="./main.js"></script>
</body></html>
